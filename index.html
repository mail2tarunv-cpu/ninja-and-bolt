<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101923">
  <title>Ninja & Bolt — Temple of Balance</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>NINJA <em>&</em> BOLT</strong>
      <small>TEMPLE OF BALANCE / LEVEL 03</small>
    </div>
    <div class="level-status">
      <span class="eyebrow">CURRENT CHALLENGE</span>
      <span id="objective">THE FIRST BALANCE</span>
      <span id="step" class="counter">01 / 04</span>
    </div>
    <div class="actions">
      <button id="hint" type="button">? Hint <span>H</span></button>
      <button id="restart" type="button">↺ Restart <span>R</span></button>
    </div>
  </header>
  <main id="game" aria-label="Ninja and Bolt — two-player Temple of Balance cooperative platform game"></main>
  <section class="instructions" aria-label="Two-player keyboard controls">
    <div class="control"><span class="player-tag ninja-tag">NINJA</span> <b>A</b> <b>D</b> move · <b>W</b> jump · <b>F</b> interact</div>
    <div class="control"><span class="player-tag bolt-tag">BOLT</span> <b>←</b> <b>→</b> move · <b>↑</b> jump · <b>Enter</b> carry / install</div>
    <span class="keyboard-note">Two players · One keyboard · Greybox</span>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="victory" aria-live="polite">
    <div class="victory-card">
      <span>LEVEL 03 COMPLETE</span>
      <h1>Balance mastered.</h1>
      <p>Both heroes solved the temple together.</p>
      <button type="button">Play again ↺</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
