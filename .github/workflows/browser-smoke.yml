name: Browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save screenshot if test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temple-smoke-screenshot
          path: smoke-temple.png
